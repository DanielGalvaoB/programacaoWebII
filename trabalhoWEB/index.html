<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Pokémon</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    
    <script src="js/app.js" defer></script>

    <h1>POKEDEX</h1>
    <div class="pokedex">
        <div class="tela">

            <p id="statusMSG">Digite um Pokémon</p>
            <div id="pokeInfo"></div>

        </div>

        <div class="ferramentas">

            <input 
                type="text"
                id="pokeInput"
                placeholder="Nome ou Número"
            >
            <button id="btnBusca">Buscar</button>
        </div>
    </div>
    
</body>
</html>
